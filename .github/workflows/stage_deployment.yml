name: STAGE Deployment

on:
  push:
    paths:
      - 'src/public/**'
      - 'src/**'
      - '.github/workflows/stage_deployment.yml'
    branches:
      - 'stage'

  workflow_dispatch:

jobs:

  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      BACKUP_TAG: ${{ github.event_name != 'workflow_dispatch' && github.run_number || github.sha }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: 8.3
          tools: composer:2.4.4

      - name: Prepare Composer Repositories
        env:
          SSH_KEY: ${{ secrets.SSH_KEY }}
          SHOPWARE_STORE_TOKEN: ${{ secrets.SHOPWARE_STORE_TOKEN }}
          LOCK_DSN: "flock"
        run: |
          mkdir ~/.ssh
          echo -e "${SSH_KEY}" >~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          cd ./src && composer install --no-scripts

      - name: Build Docker image
        env:
          Docker_login: ${{ secrets.PM_DOCKER_USERNAME }}
          Docker_pass: ${{ secrets.PM_DOCKER_PASSWORD }}
        run: |
          # Login to Azure Container Registry
          echo "Docker login: ${Docker_login}"
          echo "Docker password: ${Docker_pass}"
          docker login -u ${Docker_login} -p ${Docker_pass} pmdocker.azurecr.io
          # Pull base image and build
          docker pull pmdocker.azurecr.io/pm-shopware6:php8.3
          # Login to GitHub Container Registry
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
          docker build -f ./src/Dockerfile -t ghcr.io/${{ github.repository_owner }}/hsu-shop:stage -t ghcr.io/${{ github.repository_owner }}/hsu-shop:stage-${{ env.BACKUP_TAG }} .

      - name: Push Docker images
        run: |
          docker push ghcr.io/${{ github.repository_owner }}/hsu-shop:stage
          docker push ghcr.io/${{ github.repository_owner }}/hsu-shop:stage-${{ env.BACKUP_TAG }}
